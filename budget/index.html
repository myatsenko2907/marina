<style id="page-style">
/* Layout: sticky header + section nav, summary first (KPIs, chart), then editable tables, then monthly P&L. */
:root{

  --rev:#1f6b4f; --exp:#c7772d; --pos:#1d7a45; --neg:#b8382f; --warn-bg:#fff4dc; --warn-fg:#7a5410;
  --c-team:#2f6f9f; --c-ads:#c7772d; --c-admin:#7b5ea7; --c-direct:#1f6b4f; --c-other:#8a958d; --c-tax:#b8382f;
  --font-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --surface-2:#222c27; --line:#33403a; --fg:#e6ece8; --muted:#9aa9a0;
  --accent:#5cc095; --accent-fg:#0d1511; --accent-soft:#1f3a2e;
  --rev:#5cc095; --exp:#e39a55; --pos:#5cc58a; --neg:#ef7b70; --warn-bg:#3a2f17; --warn-fg:#f1cf8a;
  --c-team:#6fa8d6; --c-ads:#e39a55; --c-admin:#a98fd6; --c-direct:#5cc095; --c-other:#8c9a91; --c-tax:#ef7b70;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --surface-2:#222c27; --line:#33403a; --fg:#e6ece8; --muted:#9aa9a0;
  --accent:#5cc095; --accent-fg:#0d1511; --accent-soft:#1f3a2e;
  --rev:#5cc095; --exp:#e39a55; --pos:#5cc58a; --neg:#ef7b70; --warn-bg:#3a2f17; --warn-fg:#f1cf8a;
  --c-team:#6fa8d6; --c-ads:#e39a55; --c-admin:#a98fd6; --c-direct:#5cc095; --c-other:#8c9a91; --c-tax:#ef7b70;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:18px;margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field-inline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
nav.sections{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.sections a{flex:none;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px;font-weight:500;font-size:13px}
nav.sections a:hover,nav.sections a:focus-visible{background:var(--surface-2);color:var(--fg)}
button,.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{background:var(--surface-2)}

button.ghost:hover{color:var(--fg);background:var(--surface-2)}
button.icon{padding:4px 7px;border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
button.icon:hover{color:var(--neg);background:var(--surface-2)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px}
.sec-head h2{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0;margin-right:auto;text-wrap:balance}
.sec-head p{margin:0;color:var(--muted);font-size:13px;flex-basis:100%;order:3}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--warn-bg);color:var(--warn-fg);padding:10px 14px;border-radius:var(--r);font-size:13px}
.banner b{font-weight:600}
.banner button{background:transparent;border-color:currentColor;color:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .sub{font-size:12px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.panels{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px}
@media (max-width:860px){.panels{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{margin:0 0 8px;font-size:13px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.line{height:3px;border-radius:2px;vertical-align:3px;width:14px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-ui)}
.struct{display:flex;flex-direction:column;gap:9px}
.struct-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.struct-row .bar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.struct-row .bar span{display:block;height:100%;border-radius:3px}
.struct-row .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.struct-row .num b{color:var(--fg);font-weight:600}
.table-box{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-block:8px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
thead th:first-child{background:var(--surface-2);z-index:2}
tfoot td{font-weight:700;background:var(--surface-2);border-bottom:0}
tfoot td:first-child{background:var(--surface-2)}
tr.sub td{font-weight:500;color:var(--muted);background:var(--surface)}
td.calc{color:var(--fg);font-weight:600;padding-inline:10px}
td.total{background:var(--accent-soft);font-weight:700;padding-inline:10px}
tfoot td.total{background:var(--accent-soft)}
td input{width:96px;text-align:right;border-color:transparent;background:transparent;padding:5px 6px;font-variant-numeric:tabular-nums}
td input:hover{border-color:var(--line)}
td input:focus{border-color:var(--accent);background:var(--surface);outline:none}
td input.name{width:200px;text-align:left;font-weight:500}
td input.small{width:64px}
td select{border-color:transparent;background:transparent;padding:5px 4px}
td select:hover{border-color:var(--line)}
td.actions{white-space:nowrap;text-align:right;padding-inline:2px}
.row-tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.chip.pos{background:color-mix(in srgb,var(--pos) 15%,transparent)}
.chip.neg{background:color-mix(in srgb,var(--neg) 15%,transparent)}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.settings small{font-weight:400}
.hint{font-size:12px;color:var(--muted);margin:0;max-width:80ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
@media (max-width:520px){.kpi .val{font-size:19px}.brand h1{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div id="app"></div>
<script id="budget-data" type="application/json">null</script>
<script id="app-script">
(function(){
"use strict";
var MONTHS=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];
var MONTHS_FULL=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var KINDS={ads:"Реклама",admin:"Админ персонал",other:"Прочее"};
var LS_KEY="camp-budget-draft-v1";
var uid=function(){return Math.random().toString(36).slice(2,9)};
var arr12=function(v){var a=[];for(var i=0;i<12;i++)a.push(v);return a};

// Capture the page source once, before rendering, so a save can regenerate the document.
var SRC={
  head:(function(){var s=document.head&&document.head.querySelector("style");return s&&s.id!=="page-style"?s.textContent:":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}"})(),
  style:document.getElementById("page-style").textContent,
  script:document.getElementById("app-script").textContent
};

function example(){
  var team=[
    {role:"Руководитель",v:150000},{role:"Менеджер по продажам 1",v:80000},{role:"Менеджер по продажам 2",v:80000},
    {role:"Маркетолог",v:90000},{role:"SMM",v:60000},{role:"Куратор",v:50000}
  ].map(function(t){return {id:uid(),role:t.role,salary:arr12(t.v)}});
  team[5].salary=[40000,40000,50000,50000,60000,80000,80000,80000,50000,50000,40000,60000];
  return {
    example:true, year:new Date().getFullYear()+1, currency:"₽", payrollTax:30, revenueTax:6, savedAt:0,
    team:team,
    camps:[
      {id:uid(),name:"Весенний IT-лагерь",month:2,days:7,participants:40,price:58000,cost:22000,ads:150000,adsMonths:2,admin:90000,other:30000},
      {id:uid(),name:"Летний лагерь, 1 смена",month:5,days:14,participants:70,price:92000,cost:36000,ads:280000,adsMonths:3,admin:180000,other:50000},
      {id:uid(),name:"Летний лагерь, 2 смена",month:6,days:14,participants:80,price:92000,cost:36000,ads:250000,adsMonths:3,admin:180000,other:50000},
      {id:uid(),name:"Летний лагерь, 3 смена",month:7,days:14,participants:60,price:88000,cost:36000,ads:220000,adsMonths:3,admin:170000,other:50000},
      {id:uid(),name:"Осенний лагерь",month:9,days:7,participants:35,price:58000,cost:22000,ads:120000,adsMonths:2,admin:80000,other:25000},
      {id:uid(),name:"Зимний лагерь",month:11,days:7,participants:45,price:64000,cost:25000,ads:160000,adsMonths:2,admin:95000,other:30000}
    ],
    overhead:[
      {id:uid(),name:"Реклама бренда (общая)",kind:"ads",values:[30000,40000,60000,80000,80000,50000,40000,30000,40000,40000,50000,40000]},
      {id:uid(),name:"Бухгалтер, офис-менеджер",kind:"admin",values:arr12(60000)},
      {id:uid(),name:"Аренда офиса",kind:"other",values:arr12(40000)},
      {id:uid(),name:"CRM, телефония, сервисы",kind:"other",values:arr12(15000)}
    ]
  };
}
function blank(cur){
  return {example:false,year:cur.year,currency:cur.currency,payrollTax:cur.payrollTax,revenueTax:cur.revenueTax,savedAt:0,
    team:["Руководитель","Менеджер по продажам 1","Менеджер по продажам 2","Маркетолог","SMM","Куратор"].map(function(r){return {id:uid(),role:r,salary:arr12(0)}}),
    camps:[{id:uid(),name:"Новый лагерь",month:5,days:7,participants:0,price:0,cost:0,ads:0,adsMonths:1,admin:0,other:0}],
    overhead:[{id:uid(),name:"Реклама (общая)",kind:"ads",values:arr12(0)},{id:uid(),name:"Админ персонал",kind:"admin",values:arr12(0)},{id:uid(),name:"Аренда, сервисы",kind:"other",values:arr12(0)}]};
}
function normalize(s){
  if(!s||typeof s!=="object")return null;
  var n=function(v){v=Number(v);return isFinite(v)?v:0};
  return {example:!!s.example,year:n(s.year)||new Date().getFullYear(),currency:String(s.currency||"₽").slice(0,4),
    payrollTax:n(s.payrollTax),revenueTax:n(s.revenueTax),savedAt:n(s.savedAt),
    team:(s.team||[]).map(function(t){return {id:t.id||uid(),role:String(t.role||""),salary:arr12(0).map(function(_,i){return n((t.salary||[])[i])})}}),
    camps:(s.camps||[]).map(function(c){return {id:c.id||uid(),name:String(c.name||""),month:Math.min(11,Math.max(0,n(c.month))),days:n(c.days),participants:n(c.participants),price:n(c.price),cost:n(c.cost),ads:n(c.ads),adsMonths:Math.min(12,Math.max(1,n(c.adsMonths)||1)),admin:n(c.admin),other:n(c.other)}}),
    overhead:(s.overhead||[]).map(function(o){return {id:o.id||uid(),name:String(o.name||""),kind:KINDS[o.kind]?o.kind:"other",values:arr12(0).map(function(_,i){return n((o.values||[])[i])})}})};
}

// ---------- state ----------
var embedded=null;
try{embedded=normalize(JSON.parse(document.getElementById("budget-data").textContent))}catch(e){}
var draft=null;
try{draft=normalize(JSON.parse(localStorage.getItem(LS_KEY)))}catch(e){}
var S, dirty=false;
if(draft&&(!embedded||(draft.savedAt>=embedded.savedAt&&JSON.stringify(stripMeta(draft))!==JSON.stringify(stripMeta(embedded))))){S=draft;dirty=true}
else S=embedded||example();
function stripMeta(s){var c=JSON.parse(JSON.stringify(s));delete c.savedAt;return c}

var artifactApi=null, downloadsApi=null, canPublish=true;

// ---------- math ----------
var fmt=function(v){return Math.round(v).toLocaleString("ru-RU")};
var money=function(v){return fmt(v)+" "+S.currency};
var pct=function(v){return isFinite(v)?(Math.round(v*10)/10).toLocaleString("ru-RU")+"%":"—"};
function parseNum(str){var v=parseFloat(String(str).replace(/\s| /g,"").replace(",","."));return isFinite(v)?v:0}

function campCalc(c){
  var revenue=c.participants*c.price;
  var direct=c.participants*c.cost+c.other;
  var expenses=direct+c.ads+c.admin;
  var tax=revenue*S.revenueTax/100;
  var profit=revenue-expenses-tax;
  return {revenue:revenue,direct:direct,expenses:expenses+tax,tax:tax,profit:profit,margin:revenue?profit/revenue*100:NaN,cac:c.participants?c.ads/c.participants:NaN,perHead:c.participants?(expenses+tax)/c.participants:NaN};
}
function compute(){
  var M=arr12(0).map(function(){return {revenue:0,participants:0,direct:0,campAds:0,campAdmin:0,team:0,teamTax:0,ohAds:0,ohAdmin:0,ohOther:0,tax:0}});
  S.camps.forEach(function(c){
    var m=M[c.month];
    m.revenue+=c.participants*c.price; m.participants+=c.participants;
    m.direct+=c.participants*c.cost+c.other; m.campAdmin+=c.admin;
    var k=c.adsMonths, start=c.month-k+1, per=c.ads/k;
    for(var i=0;i<k;i++){M[Math.max(0,start+i)].campAds+=per}
  });
  S.team.forEach(function(t){t.salary.forEach(function(v,i){M[i].team+=v;M[i].teamTax+=v*S.payrollTax/100})});
  S.overhead.forEach(function(o){o.values.forEach(function(v,i){M[i]["oh"+o.kind.charAt(0).toUpperCase()+o.kind.slice(1)]+=v})});
  var cum=0;
  M.forEach(function(m){
    m.tax=m.revenue*S.revenueTax/100;
    m.teamTotal=m.team+m.teamTax;
    m.ads=m.campAds+m.ohAds; m.admin=m.campAdmin+m.ohAdmin;
    m.expenses=m.direct+m.ads+m.admin+m.teamTotal+m.ohOther+m.tax;
    m.profit=m.revenue-m.expenses; cum+=m.profit; m.cum=cum;
  });
  var Y={}; ["revenue","participants","direct","campAds","campAdmin","team","teamTax","teamTotal","ohAds","ohAdmin","ohOther","ads","admin","tax","expenses","profit"].forEach(function(k){Y[k]=M.reduce(function(a,m){return a+m[k]},0)});
  var variable=Y.direct+Y.campAds+Y.campAdmin+Y.tax, fixed=Y.teamTotal+Y.ohAds+Y.ohAdmin+Y.ohOther;
  var contrib=Y.participants?(Y.revenue-variable)/Y.participants:0;
  Y.fixed=fixed; Y.contrib=contrib; Y.breakEven=contrib>0?Math.ceil(fixed/contrib):NaN;
  Y.margin=Y.revenue?Y.profit/Y.revenue*100:NaN; Y.cac=Y.participants?Y.ads/Y.participants:NaN;
  Y.minCum=Math.min.apply(null,M.map(function(m){return m.cum}));
  return {M:M,Y:Y};
}

// ---------- render ----------
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function numInput(path,val,cls){return '<input class="'+(cls||"")+'" id="in-'+path.replace(/\./g,"-")+'" data-path="'+path+'" inputmode="decimal" value="'+(val?fmt(val):"")+'" placeholder="0" aria-label="'+path+'">'}

function render(){
  var yearOpts="";for(var y=new Date().getFullYear()-1;y<=new Date().getFullYear()+3;y++)yearOpts+='<option'+(y===S.year?" selected":"")+'>'+y+'</option>';
  var curs=["₽","₴","₸","$","€","BYN","сум"],curOpts=curs.map(function(c){return '<option'+(c===S.currency?" selected":"")+'>'+c+'</option>'}).join("");
  app.innerHTML=
  '<header class="top"><div class="wrap"><div class="top-row">'+
    '<div class="brand"><h1>Бюджет лагерей</h1><span>Годовой план: команда, лагеря, реклама, админ персонал</span></div>'+
    '<div class="controls">'+
      '<label class="field-inline" for="year">Год <select id="year">'+yearOpts+'</select></label>'+
      '<label class="field-inline" for="currency">Валюта <select id="currency">'+curOpts+'</select></label>'+
      '<span class="status" id="status"></span>'+
      '<button class="primary" id="save" type="button">Сохранить</button>'+
    '</div></div>'+
    '<nav class="sections" aria-label="Разделы"><a href="#summary">Итоги</a><a href="#team">Команда</a><a href="#camps">Лагеря</a><a href="#overhead">Общие расходы</a><a href="#report">По месяцам</a><a href="#settings">Налоги и файлы</a></nav>'+
  '</div></header>'+
  '<main class="wrap">'+
    (S.example?'<div class="banner" id="example-banner"><span><b>Это пример с условными цифрами.</b> Замените их своими или начните с пустого бюджета.</span><span class="confirm" id="clear-zone"><button type="button" id="clear-ask">Начать с пустого</button></span></div>':'')+

function setCalc(key,text,cls){var el=app.querySelector('[data-calc="'+key+'"]');if(el){el.textContent=text;if(cls!==undefined){el.classList.remove("pos","neg");if(cls)el.classList.add(cls)}}}
function sign(v){return v<0?"neg":v>0?"pos":""}

function recalc(){
  var R=compute(),M=R.M,Y=R.Y;
  // team
  S.team.forEach(function(t,ri){setCalc("team-row-"+ri,fmt(t.salary.reduce(function(a,b){return a+b},0)))});
  M.forEach(function(m,i){setCalc("team-m-"+i,fmt(m.team));setCalc("teamtax-m-"+i,fmt(m.teamTax));setCalc("teamtot-m-"+i,fmt(m.teamTotal))});
  setCalc("team-y",fmt(Y.team));setCalc("teamtax-y",fmt(Y.teamTax));setCalc("teamtot-y",fmt(Y.teamTotal));
  // camps
  var tot={part:0,ads:0,admin:0,other:0,rev:0,exp:0,pr:0};
  S.camps.forEach(function(c,ri){var k=campCalc(c);
    setCalc("camp-rev-"+ri,fmt(k.revenue));setCalc("camp-exp-"+ri,fmt(k.expenses));setCalc("camp-pr-"+ri,fmt(k.profit),sign(k.profit));
    setCalc("camp-mg-"+ri,pct(k.margin),isFinite(k.margin)?sign(k.margin):"");setCalc("camp-cac-"+ri,isFinite(k.cac)?fmt(k.cac):"—");
    tot.part+=c.participants;tot.ads+=c.ads;tot.admin+=c.admin;tot.other+=c.other;tot.rev+=k.revenue;tot.exp+=k.expenses;tot.pr+=k.profit;});
  setCalc("camps-part",fmt(tot.part));setCalc("camps-ads",fmt(tot.ads));setCalc("camps-admin",fmt(tot.admin));setCalc("camps-other",fmt(tot.other));
  setCalc("camps-rev",fmt(tot.rev));setCalc("camps-exp",fmt(tot.exp));setCalc("camps-pr",fmt(tot.pr),sign(tot.pr));
  setCalc("camps-mg",pct(tot.rev?tot.pr/tot.rev*100:NaN));setCalc("camps-cac",tot.part?fmt(tot.ads/tot.part):"—");
  // overhead
  var ohM=arr12(0);
  S.overhead.forEach(function(o,ri){setCalc("oh-row-"+ri,fmt(o.values.reduce(function(a,b){return a+b},0)));o.values.forEach(function(v,i){ohM[i]+=v})});
  ohM.forEach(function(v,i){setCalc("oh-m-"+i,fmt(v))});setCalc("oh-y",fmt(ohM.reduce(function(a,b){return a+b},0)));
  renderKpis(Y);renderChart(M);renderStruct(Y);renderReport(M,Y);
}

function renderKpis(Y){
  var k=[
    ["Выручка за год",money(Y.revenue),fmt(Y.participants)+" участников",""],
    ["Расходы за год",money(Y.expenses),"ФОТ команды: "+money(Y.teamTotal),""],
    ["Прибыль",money(Y.profit),"Рентабельность "+pct(Y.margin),sign(Y.profit)],
    ["Точка безубыточности",isFinite(Y.breakEven)?fmt(Y.breakEven)+" участн.":"—",isFinite(Y.breakEven)?"При текущей марже "+money(Y.contrib)+" с участника":"Лагеря не покрывают свои расходы",""],
    ["Реклама на участника",isFinite(Y.cac)?money(Y.cac):"—","Вся реклама: "+money(Y.ads),""],
    ["Минимум на счёте",money(Math.min(0,Y.minCum)),Y.minCum<0?"Столько нужно, чтобы пройти кассовый разрыв":"Кассового разрыва нет",Y.minCum<0?"neg":"pos"]
  ];
  document.getElementById("kpis").innerHTML=k.map(function(x){return '<div class="kpi"><span class="lbl">'+x[0]+'</span><span class="val '+x[3]+'">'+x[1]+'</span><span class="sub">'+esc(x[2])+'</span></div>'}).join("");
}
function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function short(v){var a=Math.abs(v);return a>=1e6?(v/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн":a>=1e3?Math.round(v/1e3)+" тыс":String(Math.round(v))}
function renderChart(M){
  var W=760,H=280,pl=58,pr=12,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;
  var vals=[];M.forEach(function(m){vals.push(m.revenue,m.expenses,m.cum)});
  var hi=niceMax(Math.max.apply(null,vals.concat([0]))),lo=Math.min.apply(null,vals.concat([0]));lo=lo<0?-niceMax(-lo):0;
  var steps=4,range=hi-lo;var y=function(v){return pt+ih-(v-lo)/range*ih};
  var g="";for(var s=0;s<=steps;s++){var v=lo+range*s/steps;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="'+(v===0?1.4:.6)+'"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+short(v)+'</text>'}
  if(lo<0)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)" stroke-width="1"/>';
  var bw=iw/12,b=Math.min(16,bw*.32),bars="",pts=[];
  M.forEach(function(m,i){var cx=pl+bw*i+bw/2;
    bars+='<rect x="'+(cx-b-1)+'" y="'+y(Math.max(m.revenue,0))+'" width="'+b+'" height="'+Math.max(0,y(0)-y(m.revenue))+'" rx="2" fill="var(--rev)"><title>'+MONTHS_FULL[i]+': выручка '+money(m.revenue)+'</title></rect>'+
      '<rect x="'+(cx+1)+'" y="'+y(Math.max(m.expenses,0))+'" width="'+b+'" height="'+Math.max(0,y(0)-y(m.expenses))+'" rx="2" fill="var(--exp)"><title>'+MONTHS_FULL[i]+': расходы '+money(m.expenses)+'</title></rect>'+
      '<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+MONTHS[i]+'</text>';
    pts.push([cx,y(m.cum),m.cum,i]);});
  var line='<polyline points="'+pts.map(function(p){return p[0]+","+p[1]}).join(" ")+'" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/>'+
    pts.map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(p[3]===11?4:2.5)+'" fill="'+(p[2]<0?"var(--neg)":"var(--fg)")+'"><title>'+MONTHS_FULL[p[3]]+': прибыль нарастающим итогом '+money(p[2])+'</title></circle>'}).join("");
  document.getElementById("chart").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График выручки и расходов по месяцам">'+g+bars+line+'</svg>';
}
function renderStruct(Y){
  var rows=[["ФОТ команды (с начислениями)",Y.teamTotal,"--c-team"],["Реклама (лагеря и общая)",Y.ads,"--c-ads"],["Админ персонал (лагеря и офис)",Y.admin,"--c-admin"],["Проживание, питание, программа",Y.direct,"--c-direct"],["Аренда, сервисы, прочее",Y.ohOther,"--c-other"],["Налог с выручки",Y.tax,"--c-tax"]];
  var tot=Y.expenses||1;
  document.getElementById("struct").innerHTML=rows.map(function(r){var p=r[1]/tot*100;return '<div class="struct-row"><span>'+r[0]+'</span><span class="num"><b>'+fmt(r[1])+'</b> · '+pct(Y.expenses?p:0)+'</span><div class="bar"><span style="width:'+Math.max(0,Math.min(100,p))+'%;background:var('+r[2]+')"></span></div></div>'}).join("");
}
function renderReport(M,Y){
  var rows=[["Участники","participants",0],["Выручка","revenue",1],["Проживание, питание, программа","direct",0],["Реклама лагерей","campAds",0],["Реклама общая","ohAds",0],["Админ персонал лагерей","campAdmin",0],["Админ персонал офиса","ohAdmin",0],["ФОТ команды","teamTotal",0],["Аренда, сервисы, прочее","ohOther",0],["Налог с выручки","tax",0],["Расходы всего","expenses",1],["Прибыль","profit",2],["Нарастающим итогом","cum",3]];
  var h='<table><thead><tr><th>Статья</th>'+MONTHS.map(function(m){return '<th>'+m+'</th>'}).join("")+'<th>За год</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td'+(r[2]?' style="font-weight:600"':'')+'>'+r[0]+'</td>'+M.map(function(m){var v=m[r[1]];return '<td class="'+(r[2]>=2?sign(v):"")+'"'+(r[2]?' style="font-weight:600"':'')+'>'+(v?fmt(v):"—")+'</td>'}).join("")+
      '<td class="total '+(r[2]>=2?sign(r[1]==="cum"?M[11].cum:Y[r[1]]):"")+'">'+fmt(r[1]==="cum"?M[11].cum:Y[r[1]])+'</td></tr>';
  });
  document.getElementById("report-table").innerHTML=h+'</tbody></table>';
}

function setPath(path,val){var p=path.split("."),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function changed(){
  dirty=true;
  if(S.example){S.example=false;var b=document.getElementById("example-banner");if(b)b.remove()}
  try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  updateStatus();
}
app.addEventListener("input",function(e){
  var t=e.target,path=t.getAttribute("data-path");if(!path)return;
  var last=path.split(".").pop();
  if(last==="role"||last==="name"){setPath(path,t.value);changed();return}
  if(t.tagName==="SELECT")return;
  var v=parseNum(t.value);
  if(last==="adsMonths")v=Math.min(12,Math.max(1,Math.round(v)||1));
  setPath(path,v);changed();recalc();
});
app.addEventListener("change",function(e){
  var t=e.target,path=t.getAttribute("data-path");
  if(path&&t.tagName==="SELECT"){setPath(path,path.endsWith("month")?Number(t.value):t.value);changed();recalc();return}
  if(t.id==="year"){S.year=Number(t.value);document.getElementById("y-lbl").textContent=S.year;changed()}
  if(t.id==="currency"){S.currency=t.value;changed();recalc()}
  if(t.id==="payrollTax"||t.id==="revenueTax"){S[t.id]=parseNum(t.value);changed();recalc()}
  if(t.id==="imp-json"&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){try{var d=normalize(JSON.parse(r.result));if(!d||!d.team)throw 0;d.example=false;S=d;changed();render();toast("Бюджет загружен из копии")}catch(err){toast("Не удалось прочитать файл: нужен .json, скачанный из этого сервиса")}};r.readAsText(t.files[0]);t.value=""}
});
app.addEventListener("focusin",function(e){var t=e.target;if(t.tagName==="INPUT"&&t.getAttribute("inputmode")==="decimal"&&t.dataset.path){t.value=t.value.replace(/\s| /g,"");t.select()}});
app.addEventListener("focusout",function(e){var t=e.target;if(t.tagName==="INPUT"&&t.dataset.path&&t.getAttribute("inputmode")==="decimal"){var v=parseNum(t.value);t.value=v?fmt(v):""}});
app.addEventListener("click",function(e){
  var b=e.target.closest("button,label.btn");if(!b)return;
  if(b.dataset.del){var p=b.dataset.del.split(".");S[p[0]].splice(Number(p[1]),1);changed();rerenderSection(p[0]);return}
  if(b.dataset.fill){var q=b.dataset.fill.split("."),row=S[q[0]][Number(q[1])],key=q[0]==="team"?"salary":"values";row[key]=arr12(row[key][0]);changed();rerenderSection(q[0]);return}
  switch(b.id){
    case "add-team":S.team.push({id:uid(),role:"Новая должность",salary:arr12(0)});changed();rerenderSection("team");break;
    case "add-camp":S.camps.push({id:uid(),name:"Новый лагерь",month:5,days:7,participants:0,price:0,cost:0,ads:0,adsMonths:1,admin:0,other:0});changed();rerenderSection("camps");break;
    case "add-oh":S.overhead.push({id:uid(),name:"Новая статья",kind:"other",values:arr12(0)});changed();rerenderSection("overhead");break;
    case "clear-ask":document.getElementById("clear-zone").innerHTML='<span>Удалить все примерные цифры?</span><button type="button" id="clear-yes">Да, очистить</button><button type="button" id="clear-no">Отмена</button>';break;
    case "clear-no":document.getElementById("clear-zone").innerHTML='<button type="button" id="clear-ask">Начать с пустого</button>';break;
    case "clear-yes":S=blank(S);changed();render();break;
    case "save":save();break;
    case "exp-csv":download("budget-"+S.year+".csv","﻿"+toCSV(),"text/csv");break;
    case "exp-json":download("budget-"+S.year+".json",JSON.stringify(S,null,1),"application/json");break;
  }
});

function toCSV(){
  var R=compute(),M=R.M,Y=R.Y,L=[],sep=";";
  var row=function(a){L.push(a.map(function(x){x=typeof x==="number"?String(Math.round(x)):String(x);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(sep))};
  row(["Бюджет лагерей",S.year,"Валюта",S.currency]);row([]);
  row(["КОМАНДА"].concat(MONTHS_FULL,["За год"]));
  S.team.forEach(function(t){row([t.role].concat(t.salary,[t.salary.reduce(function(a,b){return a+b},0)]))});
  row(["Начисления на ЗП "+S.payrollTax+"%"].concat(M.map(function(m){return m.teamTax}),[Y.teamTax]));
  row(["ФОТ команды"].concat(M.map(function(m){return m.teamTotal}),[Y.teamTotal]));row([]);
  row(["ЛАГЕРЯ","Месяц","Дней","Участники","Цена","Себестоимость на участника","Реклама","Реклама, мес.","Админ персонал","Прочие","Выручка","Расходы","Прибыль"]);
  S.camps.forEach(function(c){var k=campCalc(c);row([c.name,MONTHS_FULL[c.month],c.days,c.participants,c.price,c.cost,c.ads,c.adsMonths,c.admin,c.other,k.revenue,k.expenses,k.profit])});row([]);
  row(["ОБЩИЕ РАСХОДЫ","Тип"].concat(MONTHS_FULL,["За год"]));
  S.overhead.forEach(function(o){row([o.name,KINDS[o.kind]].concat(o.values,[o.values.reduce(function(a,b){return a+b},0)]))});row([]);
  row(["ОТЧЁТ ПО МЕСЯЦАМ"].concat(MONTHS_FULL,["За год"]));
  [["Участники","participants"],["Выручка","revenue"],["Проживание, питание, программа","direct"],["Реклама","ads"],["Админ персонал","admin"],["ФОТ команды","teamTotal"],["Аренда, сервисы, прочее","ohOther"],["Налог с выручки","tax"],["Расходы всего","expenses"],["Прибыль","profit"]].forEach(function(r){row([r[0]].concat(M.map(function(m){return m[r[1]]}),[Y[r[1]]]))});
  row(["Нарастающим итогом"].concat(M.map(function(m){return m.cum}),[M[11].cum]));
  return L.join("\r\n");
}
function download(name,data,type){
  if(downloadsApi){downloadsApi.save({filename:name,data:new Blob([data],{type:type})}).then(function(){toast("Файл сохранён")},function(e){if(e&&e.code!=="cancelled"&&e.code!=="declined")toast("Файл не сохранён")});return}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}catch(e){toast("Скачивание недоступно в этом окне")}
}

// ---------- save ----------
function updateStatus(){
  var st=document.getElementById("status"),btn=document.getElementById("save"),hint=document.getElementById("save-hint");if(!st)return;
  var when=S.savedAt?new Date(S.savedAt).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  if(artifactApi&&canPublish){
    st.textContent=dirty?"Есть несохранённые изменения":(when?"Сохранено "+when:"");st.classList.toggle("dirty",dirty);btn.hidden=false;btn.disabled=!dirty;
    hint.textContent="«Сохранить» записывает бюджет в эту страницу: его увидят все, у кого есть ссылка. Черновик между сохранениями хранится в этом браузере.";
  }else if(artifactApi&&!canPublish){
    st.textContent="Только просмотр";btn.hidden=true;
    hint.textContent="У вас нет прав на изменение этой страницы. Правки остаются только в вашем браузере; скачайте резервную копию, чтобы их не потерять.";
  }else{
    st.textContent=dirty?"Черновик сохранён в браузере":"";st.classList.remove("dirty");btn.hidden=true;
    hint.textContent="Изменения автоматически сохраняются в этом браузере. Чтобы перенести бюджет на другой компьютер, скачайте резервную копию и загрузите её там.";
  }
}
function buildDocument(){
  var data=JSON.stringify(S).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+SRC.head+'</style></head><body>'+
    '<title>Бюджет лагерей</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">\n'+
    '<style id="page-style">'+SRC.style+'</style>\n<div id="app"></div>\n<script id="budget-data" type="application/json">'+data+'<\/script>\n<script id="app-script">'+SRC.script+'<\/script>\n</body></html>';
}
function save(){
  if(!artifactApi)return;
  var btn=document.getElementById("save");btn.disabled=true;btn.textContent="Сохраняю…";
  var prev=S.savedAt;S.savedAt=Date.now();
  artifactApi.publish(buildDocument()).then(function(){
    dirty=false;try{localStorage.removeItem(LS_KEY)}catch(e){}btn.textContent="Сохранить";updateStatus();toast("Сохранено");
  },function(err){
    S.savedAt=prev;btn.textContent="Сохранить";var c=err&&err.code;
    if(c==="conflict"){toast("Кто-то сохранил бюджет раньше вас, страница обновится. Ваш черновик остался в браузере.")}
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared"){canPublish=false;updateStatus();toast("Эту страницу нельзя изменить с вашего аккаунта")}
    else if(c==="rate_limited"){toast("Слишком часто. Подождите минуту и сохраните снова")}
    else{toast("Не удалось сохранить. Попробуйте ещё раз")}
    updateStatus();
  });
}
var tt;function toast(m){var el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},3500)}

render();
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){if(a){artifactApi=a;updateStatus()}},function(){});
  window.claude.use("downloads").then(function(d){if(d)downloadsApi=d},function(){});
}
})();
