  var head=S.team.filter(function(t){return HEAD_RE.test(t.role)}),headYear=sum(head.map(function(t){return sum(t.salary)}));
  var pool=headYear*S.motiv.poolPct/100,out={},rows=[];
  SEASONS.forEach(function(x){out[x.k]={camps:0,cap:0,part:0,share:S.motiv.shares[x.k]||0,pool:pool*(S.motiv.shares[x.k]||0)/100,coef:0,total:0}});
  S.camps.forEach(function(c){if(!(c.capacity>0&&c.participants>0))return;var k=seasonOf(c),o=out[k];
    o.camps++;o.cap+=c.capacity;o.part+=c.participants;rows.push({c:c,season:k,fill:fillOf(c)})});
  SEASONS.forEach(function(x){var o=out[x.k];o.fill=o.cap?o.part/o.cap:NaN;o.coef=o.camps?coefFor(o.fill):0;o.total=o.pool*o.coef/100});
  return {S:out,rows:rows,headYear:headYear,hasHead:head.length>0,pool:pool,shareSum:SEASONS.reduce(function(a,x){return a+(S.motiv.shares[x.k]||0)},0)};
}
function campCalc(c){var staff=c.participants*c.staffPP,ads=c.participants*c.adsPP,bonus=c.participants*c.bonus;return {staff:staff,ads:ads,bonus:bonus,total:staff+ads+bonus,perHead:c.staffPP+c.adsPP}}

function compute(){
  var M=arr12(0).map(function(){return {participants:0,team:0,campStaff:0,campAds:0,contracts:0,salesBonus:0,head:0}});
  var E={prev:{campAds:0,contracts:0,salesBonus:0},next:{campAds:0,contracts:0,salesBonus:0}};
  S.camps.forEach(function(c){var m=M[campMonth(c)],k=campCalc(c),a=adsAlloc(c,k.ads),q=adsAlloc(c,c.participants),b=adsAlloc(c,k.bonus);m.participants+=c.participants;m.campStaff+=k.staff;
    a.m.forEach(function(v,i){M[i].campAds+=v});q.m.forEach(function(v,i){M[i].contracts+=v});b.m.forEach(function(v,i){M[i].salesBonus+=v});
    E.prev.campAds+=a.prev;E.next.campAds+=a.next;E.prev.contracts+=q.prev;E.next.contracts+=q.next;E.prev.salesBonus+=b.prev;E.next.salesBonus+=b.next});
  var sc=S.sales.count;
  ["prev","next"].forEach(function(k){var e=E[k];e.sales=e.salesBonus;e.ads=e.camps=e.campAds;e.expenses=e.campAds+e.sales;
    e.contractsPer=sc?e.contracts/sc:0;e.bonusPer=sc?e.salesBonus/sc:0;e.payPer=e.bonusPer});
  var prev=E.prev.expenses;
  S.team.forEach(function(t){t.salary.forEach(function(v,i){M[i].team+=v})});
  var mv=motivCalc();SEASONS.forEach(function(x){M[x.pay].head+=mv.S[x.k].total});
  var cum=prev;
  M.forEach(function(m){
    m.camps=m.campAds; m.ads=m.campAds;
    m.salesBase=sc*S.sales.base; m.sales=m.salesBase+m.salesBonus;
    m.contractsPer=sc?m.contracts/sc:0; m.basePer=sc?S.sales.base:0; m.bonusPer=sc?m.salesBonus/sc:0; m.payPer=m.basePer+m.bonusPer;
    m.staffAll=m.team+m.sales;
    m.expenses=m.team+m.sales+m.camps; cum+=m.expenses; m.cum=cum;
  });
  var Y={};["participants","team","campStaff","campAds","camps","ads","expenses","contracts","salesBase","salesBonus","sales","contractsPer","basePer","bonusPer","payPer","staffAll","head"].forEach(function(k){Y[k]=sum(M.map(function(m){return m[k]}))});
  ["campAds","camps","ads","expenses","contracts","salesBonus","sales","contractsPer","bonusPer","payPer"].forEach(function(k){Y[k]+=(E.prev[k]||0)+(E.next[k]||0)});
  Y.staffAll=Y.team+Y.sales; Y.E=E; Y.prevAds=E.prev.expenses; Y.nextAds=E.next.expenses;
  Y.perHead=Y.participants?Y.expenses/Y.participants:NaN;
  Y.campPerHead=Y.participants?Y.camps/Y.participants:NaN;
  Y.mv=mv; Y.staffFixed=Y.team+Y.salesBase; Y.coverage=Y.campStaff-Y.staffFixed; Y.needPP=Y.participants?Y.staffFixed/Y.participants:NaN;
  Y.adsPerHead=Y.participants?Y.ads/Y.participants:NaN;
  return {M:M,Y:Y};
}

function setCalc(key,text){var el=app.querySelector('[data-calc="'+key+'"]');if(el)el.textContent=text}
function recalc(){
  var R=compute(),M=R.M,Y=R.Y;
  S.team.forEach(function(t,ri){setCalc("team-row-"+ri,fmt(sum(t.salary)))});
  M.forEach(function(m,i){setCalc("team-m-"+i,fmt(m.team))});setCalc("team-y",fmt(Y.team));
  var tot={cap:0,inCap:0,part:0,staff:0,ads:0,bonus:0,all:0};
  S.camps.forEach(function(c,ri){var k=campCalc(c);
    var fl=fillOf(c);setCalc("camp-fill-"+ri,isFinite(fl)?pct(fl*100):"—");tot.cap+=c.capacity>0?c.capacity:0;tot.inCap+=c.capacity>0?c.participants:0;
    var w=adsWindow(c);setCalc("camp-win-"+ri,fmtD(w.begin)+" – "+fmtD(w.end));
    setCalc("camp-staff-"+ri,fmt(k.staff));setCalc("camp-ads-"+ri,fmt(k.ads));setCalc("camp-bonus-"+ri,fmt(k.bonus));setCalc("camp-tot-"+ri,fmt(k.total));
    tot.part+=c.participants;tot.staff+=k.staff;tot.ads+=k.ads;tot.bonus+=k.bonus;tot.all+=k.total;});
  setCalc("camps-part",fmt(tot.part));setCalc("camps-cap",fmt(tot.cap));setCalc("camps-fill",tot.cap?pct(tot.inCap/tot.cap*100):"—");setCalc("camps-staff",fmt(tot.staff));setCalc("camps-ads",fmt(tot.ads));setCalc("camps-bonus",fmt(tot.bonus));setCalc("camps-tot",fmt(tot.all));
  setCalc("camps-staffpp",tot.part?"в ср. "+fmt(tot.staff/tot.part):"—");setCalc("camps-adspp",tot.part?"в ср. "+fmt(tot.ads/tot.part):"—");
  var cv=document.getElementById("coverage");
  if(cv){cv.style.background=Y.coverage<0?"color-mix(in srgb,var(--neg) 12%,transparent)":"color-mix(in srgb,var(--pos) 12%,transparent)";cv.style.color=Y.coverage<0?"var(--neg)":"var(--pos)";
    cv.innerHTML='<span>Заложено на персонал: <b>'+money(Y.campStaff)+'</b> · ФОТ команды и ставки продажников за год: <b>'+money(Y.staffFixed)+'</b> · '+(Y.coverage<0?'Не хватает <b>'+money(-Y.coverage)+'</b>':'Запас <b>'+money(Y.coverage)+'</b>')+(isFinite(Y.needPP)&&Y.staffFixed?' · Чтобы покрыть ФОТ, нужно в среднем <b>'+money(Y.needPP)+'</b> на участника':'')+' · Бонусы продажникам сюда не входят: на них есть колонка «Бонус за договор» ('+money(Y.salesBonus)+')</span>';}

}

function campCount(){return S.camps.filter(function(c){return c.participants>0}).length}

function niceMax(v){if(v<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function short(v){var a=Math.abs(v);return a>=1e6?(v/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн":a>=1e3?Math.round(v/1e3)+" тыс":String(Math.round(v))}
function renderChart(M){
  var W=760,H=280,pl=58,pr=12,pt=12,pb=26,iw=W-pl-pr,ih=H-pt-pb;

  var g="";for(var s=0;s<=4;s++){var v=hi*s/4;g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="'+(s===0?1.2:.6)+'"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+short(v)+'</text>'}
  var parts=[["team","--c-team","Команда"],["sales","--c-admin","Продажники"],["campAds","--c-ads","Реклама лагерей"]];
  var bw=iw/12,b=Math.min(34,bw*.62),bars="";

    parts.forEach(function(p){var v=m[p[0]];if(v<=0)return;
      bars+='<rect x="'+(cx-b/2)+'" y="'+y(acc+v)+'" width="'+b+'" height="'+Math.max(0,y(acc)-y(acc+v))+'" fill="var('+p[1]+')"><title>'+MONTHS_FULL[i]+', '+p[2].toLowerCase()+': '+money(v)+'</title></rect>';acc+=v});
    bars+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+MONTHS[i]+'</text>';});
  document.getElementById("chart").innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Расходы по месяцам">'+g+bars+'</svg>';

    S.savedAt=prev;btn.textContent="Сохранить";var c=err&&err.code;
    if(c==="conflict"){toast("Кто-то сохранил бюджет раньше вас, страница обновится. Ваш черновик остался в браузере.")}
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared"){canPublish=false;toast("Эту страницу нельзя изменить с вашего аккаунта")}
    else if(c==="rate_limited"){toast("Слишком часто. Подождите минуту и сохраните снова")}
    else{toast("Не удалось сохранить. Попробуйте ещё раз")}
    updateStatus();
  });
}
var tt;function toast(m){var el=document.querySelector(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},3500)}

render();
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("artifact").then(function(a){if(a){artifactApi=a;updateStatus()}},function(){});
  window.claude.use("downloads").then(function(d){if(d)downloadsApi=d},function(){});
}
})();
</script>
