<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>How-to walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Покрокові проходи по сервісах: браузер з реальною адресою, схема інтерфейсу (без логотипів), підсвічування кроку і курсор */
  :root{--ink:#121317;--sub:#62666F;--line:#E4E2DD;--grad:linear-gradient(100deg,#FF4A1C,#FF2D78 55%,#FFB01F 110%);--hot:#FF2D78}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1280px;height:720px;overflow:hidden;background:#E9E6E0;font:600 16px/1.45 Manrope,sans-serif;color:var(--ink)}
  .browser{position:absolute;left:250px;top:22px;right:22px;bottom:22px;background:#fff;border-radius:14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
  .chrome{height:46px;background:#F1F0ED;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;flex:none}
  .dots{display:flex;gap:7px}.dots i{width:12px;height:12px;border-radius:50%;background:#D9D6CF}
  .dots i:nth-child(1){background:#FF6159}.dots i:nth-child(2){background:#FFBD2E}.dots i:nth-child(3){background:#28C941}
  .url{flex:1;height:30px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font:700 14px Manrope;color:#33363F}
  .url b{color:var(--ink)}
  .url::before{content:"🔒";font-size:11px;filter:grayscale(1)}
  .page{flex:1;position:relative;overflow:hidden}
  .side{position:absolute;left:18px;top:22px;width:218px;display:flex;flex-direction:column;gap:8px;z-index:8}
  .stepcard{background:#fff;border-radius:14px;padding:9px 12px;box-shadow:0 10px 30px -18px rgba(0,0,0,.4);opacity:.45;transition:opacity .3s,transform .3s}
  .stepcard.on{opacity:1;transform:translateX(6px)}
  .stepcard.done{opacity:.8}
  .stepcard b{display:flex;align-items:center;gap:8px;font:800 12px Manrope;letter-spacing:.08em;text-transform:uppercase;color:var(--hot)}
  .stepcard b i{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
  .stepcard.done b i{background:#12A150}
  .stepcard p{font-size:13px;margin-top:3px;line-height:1.3}
  .svc{font:800 12px Manrope;margin-bottom:2px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
  /* підсвічування */
  .hl{position:absolute;border:3px solid var(--hot);border-radius:14px;box-shadow:0 0 0 9999px rgba(18,19,23,.28),0 0 0 6px rgba(255,45,120,.25);transition:all .5s cubic-bezier(.45,.05,.3,1);pointer-events:none;z-index:6;opacity:0}
  .hl.on{opacity:1}
  .tip{position:absolute;z-index:7;background:var(--ink);color:#fff;font:800 14px Manrope;padding:8px 12px;border-radius:10px;white-space:nowrap;opacity:0;transition:opacity .3s}
  .tip.on{opacity:1}
  .cursor{position:fixed;left:0;top:0;width:26px;height:26px;z-index:9;transition:transform .7s cubic-bezier(.45,.05,.3,1);pointer-events:none}
  .cursor svg{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .click{position:fixed;width:40px;height:40px;border-radius:50%;border:3px solid var(--hot);z-index:8;transform:translate(-50%,-50%) scale(.3);opacity:0;pointer-events:none}
  .click.go{animation:ck .5s ease-out}
  @keyframes ck{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
  .caret{display:inline-block;width:2px;height:17px;background:var(--hot);vertical-align:-3px;animation:bl .8s step-end infinite}
  @keyframes bl{50%{opacity:0}}
  .ui{position:absolute;inset:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font:800 14px Manrope;padding:10px 18px}
  .b-dark{background:#1F1F24;color:#fff}.b-light{background:#F1F0ED;color:var(--ink)}.b-hot{background:#5B4CF0;color:#fff}
  .box{border:1.5px solid var(--line);border-radius:16px;background:#fff}
  .img{object-fit:cover;border-radius:12px;opacity:0;transition:opacity .5s}
  .img.on{opacity:1}
  .gen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.85);font:800 15px Manrope;color:var(--sub);opacity:0;transition:opacity .3s;border-radius:inherit}
  .gen.on{opacity:1}
  .gen i{display:block;width:180px;height:6px;border-radius:6px;background:#EEE;margin-top:10px;overflow:hidden}
  .gen i::after{content:"";display:block;height:100%;width:40%;background:var(--grad);animation:ld 1.2s ease-in-out infinite}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
</style>
</head>
<body>
<div class="side" id="side"><div class="svc" id="svcname"></div></div>
<div class="browser"><div class="chrome"><span class="dots"><i></i><i></i><i></i></span><div class="url" id="url"><b>gemini.google.com</b></div></div><div class="page" id="page"></div></div>
<div class="hl" id="hl"></div><div class="tip" id="tip"></div>
<div class="cursor" id="cur"><svg viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-7.5L20 11z" fill="#fff" stroke="#121317" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<div class="click" id="clk"></div>

<template id="t-gemini">
  <div class="ui">
    <div id="greet" style="position:absolute;left:0;right:0;top:120px;text-align:center;font:700 34px Manrope;color:#3B3E46">Чим можу допомогти?</div>
    <div id="chat" style="position:absolute;left:90px;right:90px;top:70px;bottom:130px;display:flex;flex-direction:column;gap:14px;align-items:flex-end"></div>
    <div class="box" id="input" style="position:absolute;left:90px;right:90px;bottom:34px;min-height:76px;padding:12px 16px 12px 64px;border-radius:28px;font-size:15px;color:#3B3E46">
      <span id="itext" style="color:#9A9DA6">Запитайте Gemini</span>
      <span id="plus" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#F1F0ED;display:grid;place-items:center;font:700 24px Manrope">+</span>
      <span id="send" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#1F1F24;color:#fff;display:grid;place-items:center">➤</span>
      <img id="thumb" class="img" style="position:absolute;left:64px;top:-62px;width:56px;height:56px" alt="">
    </div>
    <div id="menu" class="box" style="position:absolute;left:100px;bottom:120px;width:230px;padding:8px;display:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.3)">
      <div id="m-upload" style="padding:10px 12px;border-radius:10px;font-weight:700">⬆ Завантажити файли</div>
      <div style="padding:10px 12px;color:var(--sub)">Додати з Диска</div>
      <div style="padding:10px 12px;color:var(--sub)">Фото</div>
    </div>
  </div>
</template>

<template id="t-kling">
  <div class="ui" style="display:grid;grid-template-columns:330px 1fr">
    <div style="border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;background:#FAFAF8">
      <div style="display:flex;gap:6px"><span id="k-t2v" class="btn b-light" style="padding:8px 12px">Text to Video</span><span id="k-i2v" class="btn b-light" style="padding:8px 12px">Image to Video</span></div>
      <div id="k-upload" class="box" style="height:150px;display:grid;place-items:center;color:var(--sub);position:relative;overflow:hidden">⬆ Завантажити фото<img id="k-img" class="img" style="position:absolute;inset:0;width:100%;height:100%" alt=""></div>
      <div id="k-prompt" class="box" style="height:120px;padding:10px 12px;font-size:14px;color:#3B3E46"><span id="k-text" style="color:#9A9DA6">Опишіть рух…</span></div>
      <div style="display:flex;gap:8px"><span id="k-dur" class="btn b-light" style="padding:8px 12px">5s</span><span class="btn b-light" style="padding:8px 12px">9:16</span></div>
      <span id="k-gen" class="btn b-hot" style="margin-top:auto;padding:14px">Generate</span>
    </div>
    <div style="position:relative;background:#111;display:grid;place-items:center"><span style="color:#777;font-weight:700">Результат</span>
      <video id="k-out" class="img" style="position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain" muted loop playsinline></video><div class="gen" id="k-gen-ov" style="background:rgba(17,17,17,.8);color:#ddd">Генерація…<i></i></div></div>
  </div>
</template>

<template id="t-canva">
  <div class="ui" style="background:#F6F6F4">
    <div style="height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 18px;background:#fff"><span id="c-create" class="btn b-hot">Створити дизайн</span></div>
    <div id="c-dialog" class="box" style="position:absolute;right:18px;top:64px;width:280px;padding:14px;display:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.3)">
      <div style="font-weight:800;margin-bottom:8px">Власний розмір</div>
      <div style="display:flex;gap:8px"><span id="c-w" class="box" style="flex:1;padding:8px 10px">1080</span><span id="c-h" class="box" style="flex:1;padding:8px 10px">1350</span></div>
      <span id="c-ok" class="btn b-hot" style="margin-top:10px;width:100%">Створити новий дизайн</span>
    </div>
    <div id="c-canvas" style="position:absolute;left:50%;top:80px;bottom:24px;aspect-ratio:4/5;transform:translateX(-50%);background:#fff;box-shadow:0 6px 20px -8px rgba(0,0,0,.25);overflow:hidden;display:none">
      <img id="c-img" class="img" style="width:100%;height:100%;border-radius:0" alt="">
      <div id="c-title" style="position:absolute;left:28px;top:40px;width:60%;font:900 34px/1.05 Unbounded;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.4);opacity:0;transition:opacity .4s">Шкіра як після відпустки</div>
      <div id="c-btn" style="position:absolute;left:28px;bottom:36px;background:#fff;color:#121317;font:800 18px Manrope;padding:12px 22px;border-radius:999px;opacity:0;transition:opacity .4s">Замовити</div>
    </div>
    <div id="c-tools" style="position:absolute;left:14px;top:80px;display:none;flex-direction:column;gap:8px"><span id="c-upl" class="btn b-light">⬆ Завантаження</span><span id="c-text" class="btn b-light">T Текст</span></div>
  </div>
</template>

<template id="t-suno">
  <div class="ui" style="background:#101012;color:#eee;display:grid;grid-template-columns:360px 1fr">
    <div style="padding:20px;display:flex;flex-direction:column;gap:12px;border-right:1px solid #2A2A2E">
      <div style="font:800 20px Manrope">Create</div>
      <div id="s-desc" style="height:140px;border-radius:14px;background:#1C1C20;border:1.5px solid #2E2E33;padding:12px;font-size:14px;color:#ddd"><span id="s-text" style="color:#777">Опишіть пісню…</span></div>
      <div id="s-instr" style="display:flex;justify-content:space-between;align-items:center;background:#1C1C20;border-radius:12px;padding:10px 12px;font-weight:700">Instrumental <span id="s-tog" style="width:40px;height:22px;border-radius:22px;background:#3A3A40;position:relative;transition:background .3s"><i id="s-knob" style="position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .3s"></i></span></div>
      <span id="s-create" class="btn" style="background:linear-gradient(90deg,#F97316,#EC4899);color:#fff;padding:14px;margin-top:auto">Create</span>
    </div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:10px" id="s-list"></div>
  </div>
</template>

<template id="t-capcut">
  <div class="ui" style="background:#16161A;color:#ddd">
    <div style="height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #2A2A2E"><span style="display:flex;gap:8px"><span id="cc-ratio" class="btn" style="background:#2A2A30;color:#ddd;padding:7px 12px">9:16</span><span id="cc-text" class="btn" style="background:#2A2A30;color:#ddd;padding:7px 12px">T Текст</span><span id="cc-audio" class="btn" style="background:#2A2A30;color:#ddd;padding:7px 12px">♪ Аудіо</span></span><span id="cc-export" class="btn" style="background:#22D3EE;color:#0B0B0D;padding:8px 16px">Експорт</span></div>
    <div style="position:absolute;top:60px;left:0;right:0;bottom:170px;display:grid;place-items:center"><div style="height:100%;aspect-ratio:9/16;background:#000;position:relative;overflow:hidden;border-radius:8px"><video id="cc-prev" class="img" style="width:100%;height:100%;border-radius:0" muted loop playsinline></video></div></div>
    <div id="cc-tl" style="position:absolute;left:0;right:0;bottom:0;height:160px;border-top:1px solid #2A2A2E;padding:14px 16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:4px;height:44px" id="cc-v"></div>
      <div style="height:22px;display:flex"><span id="cc-t" style="width:0;background:#7C3AED;border-radius:6px;transition:width .6s"></span></div>
      <div style="height:22px;display:flex"><span id="cc-a" style="width:0;background:#0EA5E9;border-radius:6px;transition:width .8s"></span></div>
    </div>
  </div>
</template>

<template id="t-chatgpt">
  <div class="ui">
    <div id="g-chat" style="position:absolute;left:120px;right:120px;top:30px;bottom:130px;display:flex;flex-direction:column;gap:16px;font-size:15px"></div>
    <div class="box" id="g-input" style="position:absolute;left:120px;right:120px;bottom:34px;min-height:64px;padding:18px 60px 18px 20px;border-radius:26px;color:#3B3E46"><span id="g-text" style="color:#9A9DA6">Запитайте що завгодно</span><span id="g-send" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#1F1F24;color:#fff;display:grid;place-items:center">↑</span></div>
  </div>
</template>

<script>
  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const cur = $('cur'); let cx = 900, cy = 600; cur.style.transform = `translate(${cx}px,${cy}px)`;
  const el = s => typeof s === 'string' ? (document.getElementById(s) || document.querySelector(s)) : s;
  async function moveTo(s, dx = .5, dy = .5){ const r = el(s).getBoundingClientRect(); cx = r.left + r.width * dx; cy = r.top + r.height * dy; cur.style.transform = `translate(${cx}px,${cy}px)`; await sleep(750); }
  async function clickFx(){ const c = $('clk'); c.style.left = cx + 'px'; c.style.top = cy + 'px'; c.classList.remove('go'); void c.offsetWidth; c.classList.add('go'); await sleep(350); }
  function highlight(s, text, side = 'top'){
    const r = el(s).getBoundingClientRect(), h = $('hl'), t = $('tip'), pad = 6;
    Object.assign(h.style, {left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px'}); h.classList.add('on');
    if (text){ t.textContent = text; t.classList.add('on'); const tr = t.getBoundingClientRect();
      let x = Math.min(Math.max(r.left + r.width / 2 - tr.width / 2, 260), 1250 - tr.width), y = side === 'top' ? r.top - tr.height - 16 : r.bottom + 16;
      if (y < 70) y = r.bottom + 16; t.style.left = x + 'px'; t.style.top = y + 'px'; } else t.classList.remove('on');
  }
  function unhl(){ $('hl').classList.remove('on'); $('tip').classList.remove('on'); }
  async function typeInto(id, text, cps = 30){ const n = $(id); n.style.color = 'inherit'; n.innerHTML = '<span></span><span class="caret"></span>'; const s = n.firstChild; for (const ch of text){ s.textContent += ch; await sleep(1000 / cps * (ch === ' ' ? .6 : 1)); } await sleep(300); n.lastChild.remove(); }
  let stepN = 0;
  const A = {
    service: async ([url, name, layout]) => { $('url').innerHTML = `<b>${url}</b>`; $('svcname').textContent = name; $('page').innerHTML = ''; $('page').appendChild($('t-' + layout).content.cloneNode(true)); await sleep(400); },
    steps: async list => { $('side').querySelectorAll('.stepcard').forEach(n => n.remove()); list.forEach((t, i) => { const d = document.createElement('div'); d.className = 'stepcard'; d.id = 'st' + i; d.innerHTML = `<b><i>${i + 1}</i>Крок ${i + 1}</b><p>${t}</p>`; $('side').appendChild(d); }); stepN = 0; },
    step: async i => { document.querySelectorAll('.stepcard').forEach((c, k) => { c.classList.toggle('on', k === i); c.classList.toggle('done', k < i); if (k < i) c.querySelector('i').textContent = '✓'; }); },
    hl: async ([s, text, side]) => { highlight(s, text, side); await moveTo(s); },
    click: async s => { await moveTo(s); await clickFx(); },
    unhl: async () => unhl(),
    type: async ([id, text, cps]) => typeInto(id, text, cps),
    show: async ([id, src]) => { const n = $(id); n.src = src; if (n.play) n.play().catch(() => {}); n.classList.add('on'); await sleep(500); },
    display: async ([id, v]) => { $(id).style.display = v; await sleep(200); },
    opacity: async ([id, v]) => { $(id).style.opacity = v; await sleep(300); },
    css: async ([id, prop, v]) => { $(id).style[prop] = v; await sleep(200); },
    gen: async ([id, ms]) => { $(id).classList.add('on'); await sleep(ms); $(id).classList.remove('on'); },
    bubble: async ([chat, html, me]) => { const g = document.getElementById('greet'); if (g) g.style.display = 'none'; const d = document.createElement('div'); d.style.cssText = me ? 'align-self:flex-end;background:#F1F0ED;border-radius:18px;padding:10px 14px;max-width:70%' : 'align-self:flex-start;max-width:90%;line-height:1.55'; d.innerHTML = html; $(chat).appendChild(d); await sleep(300); },
    stream: async ([chat, text, cps]) => { const d = document.createElement('div'); d.style.cssText = 'align-self:flex-start;max-width:92%;line-height:1.55;white-space:pre-line'; $(chat).appendChild(d); for (const ch of text){ d.textContent += ch; await sleep(1000 / (cps || 90)); } },
    hide: async id => { $(id).style.display = 'none'; },
    wait: async ms => sleep(ms),
  };
  window.runScenario = async steps => { for (const [a, p] of steps) await A[a](p); window.DONE = true; };
</script>
</body>
</html>
